schema_version = "1.3"
artifacts = ["/workspace/submission.csv"]

[task]
name = "autods-mlab/imdb"
description = "MLAgentBench IMDb — text sentiment classification (transformers / sentence-transformers)"
keywords = ["mlab", "mlagentbench", "text", "nlp", "transformers", "autods"]
[[task.authors]]
name = "AutoDS"

[metadata]
family = "nlp"
metric = "accuracy"
specialized_libraries = ["transformers", "sentence-transformers", "setfit"]

[verifier]
timeout_sec = 1200.0
collect = []
[verifier.env]

[agent]
timeout_sec = 3600.0

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
os = "linux"
mcp_servers = []
[environment.env]

[solution.env]
